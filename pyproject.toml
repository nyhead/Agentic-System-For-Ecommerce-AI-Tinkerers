[project]
name = "commercecrew"
version = "0.1.0"
description = "Three-agent Shopify hackathon MVP"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn", "langgraph", "pydantic"]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "httpx"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
