name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - name: Validate project structure
        run: python scripts/check-project.py
      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.8"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Check types
        run: uv run --frozen mypy app
      - name: Run offline tests
        run: uv run --frozen pytest -q
      - name: Build deployable container
        run: docker build --tag commercecrew:ci .
      - name: Check offline container startup
        run: bash scripts/smoke-container.sh commercecrew:ci
